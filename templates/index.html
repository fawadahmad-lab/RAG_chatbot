<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UIIT Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <h2>UIIT Assistant</h2>
        <div style="display: flex; justify-content: center;">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="UIIT Logo" width="200">
        </div>
        <div id="chat-box"></div>
        <form id="chat-form">
            <input type="text" id="user-input" placeholder="Ask me anything about UIIT..." autocomplete="off" required>
            <button type="submit">↑</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("user-input");
        const chatBox = document.getElementById("chat-box");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const userText = input.value;
            input.value = "";

            chatBox.innerHTML += `<div class="chat-bubble user">${userText}</div>`;

            const response = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question: userText }),
            });

            const data = await response.json();
            chatBox.innerHTML += `<div class="chat-bubble bot"> ${data.response}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
